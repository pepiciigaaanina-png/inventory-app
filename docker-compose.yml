version: '3.8'

services:
    database:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: inventory_db
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony_password
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    web:
        build: .
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - database

volumes:
    db_data:
